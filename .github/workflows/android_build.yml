name: Build Android APK

on:
  push:
    branches: [ main, master ] # Dispara quando você envia código para a main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI & Sync
        run: |
          # Instala o CLI globalmente no runner para garantir o executável
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          
          # Tenta inicializar se o arquivo de config não existir
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "JF Servicos" "com.jfservicos.app" --web-dir dist
          fi

          # Adiciona a pasta android e sincroniza
          npx cap add android || true
          npx cap sync android
          
      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-servicos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
