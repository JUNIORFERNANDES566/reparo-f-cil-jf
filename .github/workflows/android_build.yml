name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm install
          # Força a instalação dos pacotes do Capacitor no projeto
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest --save

      - name: Build Web Project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize and Sync Capacitor
        run: |
          # Inicializa se o arquivo de config não existir
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "JF Servicos" "com.jfservicos.app" --web-dir dist
          fi
          
          # Adiciona e sincroniza a plataforma Android
          npx cap add android || true
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jf-servicos-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
